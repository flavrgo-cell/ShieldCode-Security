[package]
name = "shieldcode-vault-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "B2B Anti-Phishing Code API Vault for Financial Institutions"
license = "Proprietary"

[lib]
name = "shieldcode_vault"
path = "src/lib.rs"

[[bin]]
name = "shieldcode-vault-server"
path = "src/main.rs"

[dependencies]
# --- Async Runtime & Web Framework ---
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "macros", "signal"] }
axum = { version = "0.7", features = ["macros", "json"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "limit",
    "request-id",
    "sensitive-headers",
] }
async-trait = "0.1"

# --- Cryptography, JWT & Memory Hygiene ---
aes-gcm = { version = "0.10", features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.5", features = ["std", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
jsonwebtoken = "9.3"
hex = "0.4"
base64 = "0.22"

# --- External Communications (SMTP Email & HTTP SMS Gateway) ---
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "hostname",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# --- Database & Persistence (PostgreSQL) ---
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# --- Serialization, GeoIP (Law 18-07 Local MMDB) & Validation ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
url = "2.5"
maxminddb = "0.24"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# --- Error Handling & Observability ---
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# --- OpenAPI 3.1 / Swagger UI (`/api/docs`) ---
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
